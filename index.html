<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

:root {
    /* bg i think i forgor */
    --bg-image: url("https://raw.githubusercontent.com/itzsam0121/timer-thingy/refs/heads/main/ThePromiseCareerInstitutePrimaryLogoImage.png");
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Instrument Serif", serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white;

    background-image:
        linear-gradient(
            rgba(0, 0, 0, 0.45),
            rgba(0, 0, 0, 0.45)
        ),
        var(--bg-image);

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

#intro {
    position: absolute;
    font-size: 4rem;
    font-style: italic;
    opacity: 1;
    transition: opacity 1.5s ease, transform 1.5s ease;
}

#intro.fade-up {
    opacity: 0;
    transform: translateY(-150px);
    pointer-events: none;
}

#timer-container {
    text-align: center;
    opacity: 0;
    transition: opacity 1.5s ease;

    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);

    padding: 30px;
    border-radius: 20px;
    min-width: 350px;
}

#timer-container.show {
    opacity: 1;
}

h1 {
    margin-bottom: 20px;
    font-size: 2rem;
    font-style: italic;
}

#timer {
    font-size: 3rem;
    font-weight: bold;
    line-height: 1.4;
}
</style>
</head>

<body>

<div id="intro">Are you ready?</div>

<div id="timer-container">
    <h1>Countdown to Event</h1>
    <div id="timer">Loading...</div>
</div>

<script>
const intro = document.getElementById("intro");
const timerContainer = document.getElementById("timer-container");

// intro
setTimeout(() => {
    intro.classList.add("fade-up");

    setTimeout(() => {
        timerContainer.classList.add("show");
    }, 1000);
}, 3000);

// date stuff
const targetDate = new Date("September 14, 2026 09:00:00").getTime();

function updateTimer() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("timer").innerHTML = "done!";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
    );

    document.getElementById("timer").innerHTML =
        `${days} Days<br>
         ${hours} Hours<br>
         ${minutes} Minutes<br>
         ${seconds} Seconds`;
}

updateTimer();
setInterval(updateTimer, 1000);
</script>

</body>
</html>
