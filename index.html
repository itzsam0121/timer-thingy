<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>timer test thingy</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
        color: white;
        overflow: hidden;
    }

    #intro {
        position: absolute;
        font-size: 4rem;
        font-weight: bold;
        opacity: 1;
        transition: opacity 1.5s ease, transform 1.5s ease;
    }

    #intro.fade-up {
        opacity: 0;
        transform: translateY(-100px);
        pointer-events: none;
    }

    #timer-container {
        text-align: center;
        opacity: 0;
        transition: opacity 1.5s ease;
    }

    #timer-container.show {
        opacity: 1;
    }

    h1 {
        margin-bottom: 20px;
    }

    #timer {
        font-size: 2.5rem;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="intro">test</div>

<div id="timer-container">
    <h1>Countdown to September 17, 2026 9:00 AM</h1>
    <div id="timer">Loading...</div>
</div>

<script>
    const intro = document.getElementById("intro");
    const timerContainer = document.getElementById("timer-container");

    // Show for '3' seconds then fade up (works somehow)
    setTimeout(() => {
        intro.classList.add("fade-up");

        setTimeout(() => {
            timerContainer.classList.add("show");
        }, 1000);
    }, 3000);

    const targetDate = new Date("September 17, 2026 09:00:00").getTime();

    function updateTimer() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance <= 0) {
            document.getElementById("timer").textContent = "done!";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
            (distance % (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );
        const minutes = Math.floor(
            (distance % (1000 * 60 * 60)) /
            (1000 * 60)
        );
        const seconds = Math.floor(
            (distance % (1000 * 60)) /
            1000
        );

        document.getElementById("timer").textContent =
            `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
