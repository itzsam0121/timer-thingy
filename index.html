<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

:root {
    /* CHANGE THIS IMAGE LINK */
    --bg-image: url("https://raw.githubusercontent.com/itzsam0121/timer-thingy/refs/heads/main/ThePromiseCareerInstitutePrimaryLogoImage.png");
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Instrument Serif", serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white;
    background: black;
    position: relative;
}

/* Background Image Only */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.75)),
        var(--bg-image);

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: blur(10px);
    transform: scale(1.1);

    z-index: -1;
}
`
    
/* Black fade screen */
#fade-screen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 1000;
    opacity: 1;
    transition: opacity 1.5s ease;
}

#fade-screen.hide {
    opacity: 0;
    pointer-events: none;
}

#intro {
    position: absolute;
    z-index: 1001;
    font-size: 4rem;
    font-style: italic;
    opacity: 1;
    transition: opacity 1.5s ease, transform 1.5s ease;
}

#intro.fade-up {
    opacity: 0;
    transform: translateY(-150px);
    pointer-events: none;
}

#timer-container {
    text-align: center;
    opacity: 0;
    transition: opacity 1.5s ease;

    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);

    padding: 30px;
    border-radius: 20px;
    min-width: 350px;
}

#timer-container.show {
    opacity: 1;
}

h1 {
    margin-bottom: 20px;
    font-size: 2rem;
}

#timer {
    font-size: 2.5rem;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="fade-screen"></div>

<div id="intro">Are you ready?</div>

<div id="timer-container">
    <h1>Countdown to Event</h1>
    <div id="timer">Loading...</div>
</div>

<script>
const intro = document.getElementById("intro");
const timerContainer = document.getElementById("timer-container");
const fadeScreen = document.getElementById("fade-screen");

// Intro for 3 seconds
setTimeout(() => {
    intro.classList.add("fade-up");
    fadeScreen.classList.add("hide");

    setTimeout(() => {
        timerContainer.classList.add("show");
    }, 1000);
}, 3000);

// September 14, 2026 9:00 AM
const targetDate = new Date("September 14, 2026 09:00:00").getTime();

function updateTimer() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("timer").textContent = "done!";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
    );
    const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) / (1000 * 60)
    );
    const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
    );

    document.getElementById("timer").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateTimer();
setInterval(updateTimer, 1000);
</script>

</body>
</html>
